
name: Student Project CI

on:
  push:
  workflow_dispatch:

jobs:
  check-project:
    runs-on: ubuntu-latest

    steps:
      - name: Download source code
        uses: actions/checkout@v4

      - name: Check student project file
        run: test -f index.html

      - name: Check project heading
        run: grep -q "Student Management System" index.html

      - name: Show success message
        run: echo "Project checks passed!"
